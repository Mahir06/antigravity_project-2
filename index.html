<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Mockup Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="phone-container">
            <img src="assets/apple-iphone-16-pro-max-2024-medium.png" alt="iPhone 16 Pro Max Mockup" class="device--photo" width="364" height="750">
            
            <div class="screen-content">
                <div class="header">
                    <h2>Recent Images</h2>
                    <p>Swipe up to send to your friend's letterbox.</p>
                </div>
                
                <div class="letterbox-bg">
                    <img src="assets/letterbox.png" alt="Letterbox Background">
                    <div class="gradient-mask"></div>
                </div>

                <div class="card-stack" id="card-stack">
                    <div class="card card-2">
                        <div class="card-inner">
                            <span class="placeholder-icon">📸</span>
                        </div>
                    </div>
                    <div class="card card-1" id="draggable-card">
                        <div class="card-inner">
                            <div class="card-image-placeholder"></div>
                            <div class="card-info">
                                <h3>Beach Trip</h3>
                                <p>Just now</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
